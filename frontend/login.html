<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link rel="stylesheet" href="/static/admin.css">
    <style>
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #aa17173e, #c98f8f);
        }
        section {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            background-color: #2d102183;
            border-radius: 14px;
            border: 1.5px solid rgba(72, 13, 49, 0.4);
            box-shadow: 0 4px 20px rgba(154, 77, 77, 0.6);
        }
        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #fff;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 0.95rem;
            font-family: inherit;
        }
        button {
            padding: 10px;
            border: none;
            border-radius: 8px;
            background-color: #0077b6;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #023e8a;
        }
    </style>
</head>
<body>
    <section>
        <h2>Admin Login </h2>
        <form action="/login" method="post">
            <input type="text" name="username" placeholder="نام کاربری" required>
            <input type="password" name="password" placeholder="رمز عبور" required>
            <button type="submit">ورود</button>
        </form>
    </section>
</body>
</html>
